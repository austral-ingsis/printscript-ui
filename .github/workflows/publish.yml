name: Publish

# La imagen se construye una sola vez, en dev. Prod usa esa misma imagen: el release es el
# PR de dev a main en infraestructura, que lleva el mismo SHA.
on:
  push:
    branches: [dev]

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: PPC-INGSIS/workflow/.github/workflows/docker-publish.yml@v3

  update-infra:
    needs: publish
    uses: PPC-INGSIS/workflow/.github/workflows/update-infra.yml@v5
    with:
      image: ${{ needs.publish.outputs.image }}
      tag-var: UI_TAG
      client-id: ${{ vars.INFRA_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
